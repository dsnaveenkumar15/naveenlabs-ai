services:
  ollama:
    image: ollama/ollama:0.35.0     # pinned: bump deliberately, then re-check the chat reply
    environment:
      - OLLAMA_KEEP_ALIVE=24h      # keep the chat model loaded: no multi-second reload after a quiet spell
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g          # gemma3:4b (~3.6 GB loaded) + Radar's embedding model; still leaves the trading apps room
          cpus: "3.0"         # of 4: a reply would otherwise take every core; one is always left for the trading apps
    # No Traefik labels -- not reachable from outside this Docker network,
    # only chat-api/n8n/flowise talk to it via the internal DNS name "ollama".

  chat-api:
    build: ./chat-api
    environment:
      - CHAT_MODEL=${CHAT_MODEL:-gemma3:4b}
      - TRUST_PROXY=1
      - OLLAMA_URL=http://ollama:11434/api/chat
    depends_on:
      - ollama
    restart: unless-stopped
    # Hardened: no privilege escalation, no Linux capabilities, read-only image.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s     # check every 2 s while starting, so Traefik routes to it within seconds
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      - traefik.enable=true
      - traefik.http.routers.chat.rule=Host(`${CHAT_DOMAIN:-chat.naveenlabs.tech}`)
      - traefik.http.routers.chat.entrypoints=websecure
      - traefik.http.routers.chat.tls.certresolver=letsencrypt
      - traefik.http.services.chat.loadbalancer.server.port=8000

  n8n:
    image: n8nio/n8n:latest
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    ports:
      - 127.0.0.1:5678:5678     # private: reach it through an SSH tunnel, never a public hostname

  flowise:
    image: flowiseai/flowise:latest
    environment:
      - FLOWISE_USERNAME=${FLOWISE_USER}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
    volumes:
      - flowise_data:/root/.flowise
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000     # private: reach it through an SSH tunnel, never a public hostname

volumes:
  ollama_data:
  n8n_data:
  flowise_data:
