<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat — naveenlabs.tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat-shell">
    <header class="chat-header">
      <a class="back-link" href="https://naveenlabs.tech">&larr; naveenlabs.tech</a>
      <h1>AI Chat</h1>
      <p class="chat-sub">A small local model, running on this server. No account, nothing saved.</p>
    </header>

    <div class="chat-window" id="chat-window" aria-live="polite"></div>

    <form class="chat-form" id="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="Ask something…"
        maxlength="1000"
        autocomplete="off"
        required
      />
      <button type="submit" id="chat-send">Send</button>
    </form>
    <p class="chat-note">Rate limited to keep this fair for everyone — small model, so expect short/simple answers.</p>
  </main>

  <script src="chat.js"></script>
</body>
</html>
